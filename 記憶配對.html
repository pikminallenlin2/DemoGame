<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文物記憶配對遊戲</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(135deg,#f7efe1,#e8dcc7);color:#3e2d20;min-height:100vh}
.wrap{max-width:900px;margin:auto;padding:24px 18px 40px}
header{text-align:center}
h1{margin:8px 0 4px;font-size:clamp(28px,5vw,44px)}
.sub{margin:0 0 18px;color:#765d48}
.panel{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;align-items:center;margin:14px auto 22px}
.stat{background:#fffaf2;border:2px solid #d4b990;border-radius:14px;padding:9px 17px;font-weight:700}
button{font:inherit;cursor:pointer}
#restart,.level{border:0;border-radius:12px;padding:10px 16px;background:#795548;color:white;font-weight:700}
.levels{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.level{background:#c5ad8d;color:#3e2d20}
.level.active{background:#795548;color:white}
.board{display:grid;gap:12px;max-width:700px;margin:auto}
.card{aspect-ratio:1/1;border:0;background:none;padding:0;perspective:800px}
.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flipped .inner,.card.matched .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 12px #0002}
.back{background:repeating-linear-gradient(45deg,#6e4b35 0 8px,#825d42 8px 16px);border:4px solid #d7bb91;color:#f7ead7;font-size:34px}
.front{transform:rotateY(180deg);background:#fffaf0;border:3px solid #b88f61;flex-direction:column;font-size:clamp(35px,8vw,65px)}
.front span{font-size:12px;margin-top:4px;color:#7a614d;font-weight:700}
#message{text-align:center;min-height:34px;margin:18px 0 0;font-size:18px;font-weight:700}
.overlay{position:fixed;inset:0;background:#24170dcc;display:none;align-items:center;justify-content:center;padding:20px}
.modal{background:#fffaf2;border-radius:22px;padding:30px;max-width:420px;text-align:center;box-shadow:0 20px 50px #0005}
.modal h2{font-size:32px;margin:0 0 8px}
.modal button{margin-top:12px}
@media(max-width:560px){.wrap{padding-top:12px}.board{gap:8px}.panel{gap:8px}.stat{padding:8px 12px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🏺 文物記憶配對</h1>
  <p class="sub">翻開牌卡，找出兩張相同的文物！</p>
</header>

<div class="levels" id="levels">
  <button class="level active" data-level="1">第一關 · 6張</button>
  <button class="level" data-level="2">第二關 · 8張</button>
  <button class="level" data-level="3">第三關 · 12張</button>
  <button class="level" data-level="4">第四關 · 16張</button>
</div>

<div class="panel">
  <div class="stat">⏱ 時間：<span id="time">0</span> 秒</div>
  <div class="stat">🎯 步數：<span id="moves">0</span></div>
  <div class="stat">⭐ 配對：<span id="pairs">0</span>/<span id="total">3</span></div>
  <button id="restart">重新開始</button>
</div>

<div id="board" class="board"></div>
<div id="message">記住牌卡位置，開始配對吧！</div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>🎉 闖關成功！</h2>
    <p id="result"></p>
    <button id="next" >下一關</button>
  </div>
</div>

<script>
const artifacts=[
  ["🏺","陶罐"],["🗿","石像"],["🪙","古錢"],["⚱️","青銅器"],
  ["📜","古卷"],["🧿","玉佩"],["👑","王冠"],["🪭","古扇"]
];
const configs={
  1:{count:6,cols:3},
  2:{count:8,cols:4},
  3:{count:12,cols:3},
  4:{count:16,cols:4}
};
let level=1, first=null, second=null, lock=false, moves=0, pairs=0, seconds=0, timer=null;

const board=document.getElementById("board");
const timeEl=document.getElementById("time"), movesEl=document.getElementById("moves");
const pairsEl=document.getElementById("pairs"), totalEl=document.getElementById("total");
const message=document.getElementById("message"), overlay=document.getElementById("overlay");
const result=document.getElementById("result"), nextBtn=document.getElementById("next");

function shuffle(a){
  for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function startTimer(){
  clearInterval(timer);
  timer=setInterval(()=>{seconds++;timeEl.textContent=seconds},1000);
}
function init(l=level){
  level=l; first=second=null;lock=false;moves=0;pairs=0;seconds=0;
  clearInterval(timer);
  const cfg=configs[level], n=cfg.count/2;
  const deck=shuffle(artifacts.slice(0,n).flatMap((x,i)=>[
    {id:i,icon:x[0],name:x[1]},{id:i,icon:x[0],name:x[1]}
  ]));
  board.style.gridTemplateColumns=`repeat(${cfg.cols},1fr)`;
  board.innerHTML="";
  deck.forEach((item,i)=>{
    const btn=document.createElement("button");
    btn.className="card"; btn.dataset.id=item.id;
    btn.innerHTML=`<div class="inner"><div class="face back">?</div><div class="face front">${item.icon}<span>${item.name}</span></div></div>`;
    btn.addEventListener("click",()=>flip(btn));
    board.appendChild(btn);
  });
  totalEl.textContent=n;pairsEl.textContent=0;movesEl.textContent=0;timeEl.textContent=0;
  message.textContent="記住牌卡位置，開始配對吧！";
  document.querySelectorAll(".level").forEach(b=>b.classList.toggle("active",+b.dataset.level===level));
  startTimer();
}
function flip(card){
  if(lock || card.classList.contains("flipped") || card.classList.contains("matched")) return;
  card.classList.add("flipped");
  if(!first){first=card;return}
  second=card; moves++;movesEl.textContent=moves;lock=true;
  if(first.dataset.id===second.dataset.id){
    first.classList.add("matched");second.classList.add("matched");
    pairs++;pairsEl.textContent=pairs;
    first=second=null;lock=false;
    message.textContent="✨ 配對成功！繼續尋找下一組。";
    if(pairs===configs[level].count/2) win();
  }else{
    message.textContent="再想想它們的位置……";
    setTimeout(()=>{
      first.classList.remove("flipped");second.classList.remove("flipped");
      first=second=null;lock=false;message.textContent="換你找下一組！";
    },800);
  }
}
function win(){
  clearInterval(timer);
  const score=Math.max(1000-level*100-(seconds*3)-(moves*10),100);
  result.textContent=`第 ${level} 關完成！用了 ${seconds} 秒、${moves} 步，獲得 ${score} 分。`;
  nextBtn.textContent=level<4?"下一關":"重新挑戰";
  overlay.style.display="flex";
}
document.getElementById("restart").onclick=()=>init(level);
document.querySelectorAll(".level").forEach(b=>b.onclick=()=>{overlay.style.display="none";init(+b.dataset.level)});
nextBtn.onclick=()=>{overlay.style.display="none";init(level<4?level+1:1)};
init(1);
</script>
</body>
</html>
